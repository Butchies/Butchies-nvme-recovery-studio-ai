name: Windows Installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'requirements-build.txt'
      - 'NVMeRecoveryStudioAI.iss'
      - '.github/workflows/windows-installer.yml'
jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install builder
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NVMeRecoveryStudioAI app/main.py
      - name: Build setup installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" NVMeRecoveryStudioAI.iss'
      - name: Enforce 250 MB installer limit
        shell: pwsh
        run: |
          $items = @(Get-ChildItem installer -Filter *.exe)
          if ($items.Count -ne 1) { throw "Exactly one installer EXE is required." }
          $limit = 250MB
          if ($items[0].Length -gt $limit) { throw "Installer exceeds 250 MB. Approval required before distribution." }
          Write-Host "Installer size: $($items[0].Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: NVMeRecoveryStudioAI-Windows-Installer
          path: installer/*.exe
          if-no-files-found: error

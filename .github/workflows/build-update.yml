name: Build und Update (Windows + Linux-Boot-Stick)

on:
  push:
    branches: [main, linux-recovery-updates]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    needs: linux
    env:
      VER: 0.6.${{ github.run_number }}
      REL_TAG: ${{ github.ref_name == 'main' && 'aktuell' || 'linux-preview' }}
    steps:
      - uses: actions/checkout@v4

      - name: "[ 5 %] Qt 6 installieren"
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: "[25 %] Visual Studio vorbereiten"
        uses: ilammy/msvc-dev-cmd@v1

      - name: "[35 %] Konfigurieren"
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAPP_VERSION=${{ env.VER }}"

      - name: "[60 %] Kompilieren"
        run: cmake --build build --config Release

      - name: "[75 %] Qt-Laufzeit einsammeln"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\nvme-recovery-studio.exe dist\
          windeployqt --release --qmldir native --no-translations --compiler-runtime dist\nvme-recovery-studio.exe

      - name: "[80 %] Echte Bildschirmfotos der Oberfläche"
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:QT_FORCE_STDERR_LOGGING = "1"
          foreach ($s in @(@{n="start";d=1800},@{n="programm";d=7000})) {
            $env:NVME_SCREENSHOT = "$PWD\shots\$($s.n).png"; $env:NVME_SCREENSHOT_DELAY = "$($s.d)"
            $p = Start-Process dist\nvme-recovery-studio.exe -PassThru -RedirectStandardError "shots\$($s.n)-log.txt"
            if (-not $p.WaitForExit(30000)) { $p.Kill() }
          }
          Get-ChildItem shots
          Get-Content shots\programm-log.txt -ErrorAction SilentlyContinue | Select-Object -First 40

      - name: "[81 %] Startprüfung – Programm muss fehlerfrei starten"
        shell: pwsh
        run: |
          $log = Get-Content shots\programm-log.txt -Raw -ErrorAction SilentlyContinue
          if ($log -match 'failed to load component|is not unique|is not a type|Cannot assign|ReferenceError|TypeError|Unable to assign') {
            Write-Host $log; throw "Programm startet nicht fehlerfrei – kein Update veröffentlicht."
          }
          if (-not (Test-Path shots\programm.png)) { throw "Programmfenster wurde nicht angezeigt." }

      - name: "[82 %] Bildschirmfotos hochladen"
        uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: shots/

      - name: "[83 %] Bildschirmfotos in Zweig bildschirmfotos ablegen"
        shell: pwsh
        continue-on-error: true
        run: |
          Set-Location shots
          git init -q; git checkout -q -b bildschirmfotos
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add -A; git commit -q -m "Bildschirmfotos $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bildschirmfotos

      - name: "[85 %] Installer bauen"
        uses: actions/download-artifact@v4
        with:
          name: linux-boot-iso
          path: linux-boot/out

      - name: "[86 %] ISO prüfen und Installer bauen"
        shell: pwsh
        run: |
          $iso = 'linux-boot/out/nvme-recovery-studio-ai-linux.iso'
          $expected = (Get-Content "$iso.sha256" -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          if ((Get-FileHash $iso -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Linux-ISO-Prüfsumme stimmt nicht.' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VER" installer\NVMeRecoveryStudioAI.iss
          Get-ChildItem out\*.exe | Select-Object -First 1 | Rename-Item -NewName NVMeRecoveryStudioAI_Setup.exe
          @{ version = $env:VER; setup = "https://github.com/${{ github.repository }}/releases/download/$env:REL_TAG/NVMeRecoveryStudioAI_Setup.exe"; iso = "https://github.com/${{ github.repository }}/releases/download/$env:REL_TAG/nvme-recovery-studio-ai-linux.iso" } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM out\version.json

      - name: "[95 %] Update veröffentlichen (Release „aktuell“)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          name: NVMe Recovery Studio AI – aktuelle Version
          body: Wird vom eingebauten Updater automatisch geladen. Neu installieren ist nicht nötig.
          prerelease: false
          make_latest: ${{ github.ref_name == 'main' }}
          files: |
            out/NVMeRecoveryStudioAI_Setup.exe
            out/version.json
            linux-boot/out/nvme-recovery-studio-ai-linux.iso
            linux-boot/out/nvme-recovery-studio-ai-linux.iso.sha256

      - name: "[100 %] Release-Markierung auf aktuellen Stand setzen"
        shell: pwsh
        run: |
          git tag -f "$env:REL_TAG"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$env:REL_TAG"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VER: 0.6.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: "[ 5 %] Platz schaffen"
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: "[10–90 %] Linux-Boot-Abbild bauen (Debian 13, live-build)"
        run: |
          docker run --rm --privileged -e APP_VERSION="$VER" -v "$PWD":/repo -w /repo debian:trixie bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq live-build rsync ca-certificates curl p7zip-full >/dev/null
            ./linux-boot/build.sh'
          ls -la linux-boot/out

      - name: "Linux-Build-Protokoll auch bei Fehler sichern"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-protokoll
          path: linux-boot/out/build.log
          if-no-files-found: warn

      - name: "[92 %] Prüfen, ob das Programm im Abbild steckt"
        run: |
          sudo apt-get install -y -qq squashfs-tools >/dev/null
          mkdir -p iso && sudo mount -o loop,ro linux-boot/out/nvme-recovery-studio-ai-linux.iso iso
          unsquashfs -l iso/live/filesystem.squashfs > inhalt.txt
          grep -E 'opt/nvme-recovery-studio/bin/nvme-recovery-studio$' inhalt.txt || { echo "Programm fehlt im Abbild"; grep -iE '^E:|error' linux-boot/out/build.log | tail -40; exit 1; }
          grep -E 'mnt-nvmedaten.mount|nvme-recovery-kiosk.service' inhalt.txt | head
          grep -E 'timers.target.wants/butchies-bootreport.timer$' inhalt.txt || { echo "Bootreport-Timer fehlt im Abbild"; exit 1; }
          test -f iso/Firmware/PM981a/Dell-PM981a-G4GWG-15305129.bin || { echo "Linux-Firmwaredatei fehlt im Abbild"; exit 1; }
          echo '08156487302ee23413e2a6ceffc0ba1a94d9e881db55b407c0d81d79fa660db9  iso/Firmware/PM981a/Dell-PM981a-G4GWG-15305129.bin' | sha256sum --check
          sudo umount iso
          grep -E 'usr/sbin/nvme$|usr/sbin/smartctl$|usr/bin/fwupdtool$|openSeaChest_Firmware' inhalt.txt | head

      - name: "[95 %] Geprüftes Boot-Abbild für Windows-Installer bereitstellen"
        uses: actions/upload-artifact@v4
        with:
          name: linux-boot-iso
          path: |
            linux-boot/out/nvme-recovery-studio-ai-linux.iso
            linux-boot/out/nvme-recovery-studio-ai-linux.iso.sha256
          if-no-files-found: error

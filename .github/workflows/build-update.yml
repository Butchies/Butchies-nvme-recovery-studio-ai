name: Build und Update (Windows + Linux-Boot-Stick)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VER: 0.6.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: "[ 5 %] Qt 6 installieren"
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: "[25 %] Visual Studio vorbereiten"
        uses: ilammy/msvc-dev-cmd@v1

      - name: "[35 %] Konfigurieren"
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAPP_VERSION=${{ env.VER }}"

      - name: "[60 %] Kompilieren"
        run: cmake --build build --config Release

      - name: "[75 %] Qt-Laufzeit einsammeln"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\nvme-recovery-studio.exe dist\
          windeployqt --release --qmldir native --no-translations --compiler-runtime dist\nvme-recovery-studio.exe

      - name: "[80 %] Echte Bildschirmfotos der Oberfläche"
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:QT_FORCE_STDERR_LOGGING = "1"
          foreach ($s in @(@{n="start";d=1800},@{n="programm";d=7000})) {
            $env:NVME_SCREENSHOT = "$PWD\shots\$($s.n).png"; $env:NVME_SCREENSHOT_DELAY = "$($s.d)"
            $p = Start-Process dist\nvme-recovery-studio.exe -PassThru -RedirectStandardError "shots\$($s.n)-log.txt"
            if (-not $p.WaitForExit(30000)) { $p.Kill() }
          }
          Get-ChildItem shots
          Get-Content shots\programm-log.txt -ErrorAction SilentlyContinue | Select-Object -First 40

      - name: "[81 %] Startprüfung – Programm muss fehlerfrei starten"
        shell: pwsh
        run: |
          $log = Get-Content shots\programm-log.txt -Raw -ErrorAction SilentlyContinue
          if ($log -match 'failed to load component|is not unique|is not a type|Cannot assign|ReferenceError|TypeError|Unable to assign') {
            Write-Host $log; throw "Programm startet nicht fehlerfrei – kein Update veröffentlicht."
          }
          if (-not (Test-Path shots\programm.png)) { throw "Programmfenster wurde nicht angezeigt." }

      - name: "[82 %] Bildschirmfotos hochladen"
        uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: shots/

      - name: "[83 %] Bildschirmfotos in Zweig bildschirmfotos ablegen"
        shell: pwsh
        continue-on-error: true
        run: |
          Set-Location shots
          git init -q; git checkout -q -b bildschirmfotos
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add -A; git commit -q -m "Bildschirmfotos $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bildschirmfotos

      - name: "[85 %] Installer bauen"
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VER" installer\NVMeRecoveryStudioAI.iss
          Get-ChildItem out\*.exe | Select-Object -First 1 | Rename-Item -NewName NVMeRecoveryStudioAI_Setup.exe
          @{ version = $env:VER; setup = "https://github.com/${{ github.repository }}/releases/download/aktuell/NVMeRecoveryStudioAI_Setup.exe"; iso = "https://github.com/${{ github.repository }}/releases/download/aktuell/nvme-recovery-studio-ai-linux.iso" } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM out\version.json

      - name: "[95 %] Update veröffentlichen (Release „aktuell“)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          name: NVMe Recovery Studio AI – aktuelle Version
          body: Wird vom eingebauten Updater automatisch geladen. Neu installieren ist nicht nötig.
          prerelease: false
          make_latest: true
          files: |
            out/NVMeRecoveryStudioAI_Setup.exe
            out/version.json

      - name: "[100 %] Release-Markierung auf aktuellen Stand setzen"
        shell: pwsh
        run: |
          git tag -f aktuell
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aktuell

  linux:
    runs-on: ubuntu-latest
    needs: windows
    env:
      VER: 0.6.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: "[ 5 %] Platz schaffen"
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: "[10–90 %] Linux-Boot-Abbild bauen (Debian 13, live-build)"
        run: |
          docker run --rm --privileged -e APP_VERSION="$VER" -v "$PWD":/repo -w /repo debian:trixie bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq live-build rsync ca-certificates curl >/dev/null
            ./linux-boot/build.sh'
          ls -la linux-boot/out

      - name: "[95 %] Boot-Abbild veröffentlichen (Release „aktuell“)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          prerelease: false
          files: |
            linux-boot/out/nvme-recovery-studio-ai-linux.iso
            linux-boot/out/nvme-recovery-studio-ai-linux.iso.sha256
